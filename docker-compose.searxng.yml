# Self-hosted SearXNG metasearch used by Kraven's live web research.
#   docker compose --env-file infra/searxng/searxng.env -f docker-compose.searxng.yml up -d
# Needs infra/searxng/searxng.env (copy searxng.env.example and set a secret).
# The app then uses SEARXNG_URL=http://localhost:8888 from .env.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: kraven-searxng
    restart: unless-stopped
    ports:
      # Loopback only: the app reaches it locally; never expose it publicly.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # A dedicated env file: the app's .env holds multi-line values that
    # `docker compose` cannot parse.
    env_file:
      - ./infra/searxng/searxng.env
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
